<div class="card">

  <div class="card-header">
    {{ trip.name }}
  </div>

  <img src="assets/images/{{ trip.image }}"
       alt="trip thumbnail"
       class="card-img-top">

  <div class="card-body">

    <h6 class="card-subtitle mb-2 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-subtitle mt-3 mb-3 text-muted">
      {{ trip.length }} only
      {{ trip.perPerson | currency:'USD':'symbol' }}
      per person
    </p>

    <p class="card-text"
       [innerHTML]="trip.description">
    </p>

    <button type="button"
            class="btn btn-primary me-2"
            (click)="viewReviews(trip)">
      View Reviews
    </button>

    <button *ngIf="isAdmin$ | async"
            type="button"
            class="btn btn-info me-2"
            (click)="editTrip(trip)">
      Edit Trip
    </button>

    <button *ngIf="isAdmin$ | async"
            type="button"
            class="btn btn-danger"
            (click)="deleteTrip(trip)">
      Delete Trip
    </button>

  </div>

</div>
